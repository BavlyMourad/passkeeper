name: passkeeper
description: "PassKeeper is a secure, easy-to-use password manager app designed to store and manage your passwords efficiently. PassKeeper ensures your passwords are encrypted and safely stored, allowing you to manage credentials with ease."

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Localization support
  flutter_localizations:
    sdk: flutter

  # Internationalization and Localization
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # State Management
  riverpod_annotation: ^4.0.2
  flutter_riverpod: ^3.3.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  flutter_spinkit: ^5.2.2

  # Navigation
  go_router: ^17.2.0

  # Security & Encryption
  cryptography: ^2.9.0
  local_auth: ^3.0.1

  # Data Models & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Utilities
  uuid: ^4.5.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Light.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
